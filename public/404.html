  <script>
    // GitHub Pages SPA hack: redirect 404 to index.html with query
    // This script runs when GitHub serves 404.html for direct URL access
    // It converts the path into a query parameter and redirects to index.html
    var pathSegmentsToKeep = 1; // repo subpath: /langxiancheng-kiosk-h5/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
