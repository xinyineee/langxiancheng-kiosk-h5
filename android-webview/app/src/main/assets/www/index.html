<title>浪险橙 · 今日幸运饮品盲盒机</title>
<style>
:root{
  --orange:#FF6B35;

}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:var(--font);color:var(--text)}
button{font:inherit;border:0;cursor:pointer}
.kiosk{position:relative;width:100vw;height:100dvh;min-height:100dvh;overflow:hidden;background:
  radial-gradient(circle at 18% 6%,rgba(255,107,53,.26),transparent 30%),

.kiosk:before{content:"";position:absolute;inset:-10%;background-image:radial-gradient(rgba(255,107,53,.16) 1.2px, transparent 1.2px);background-size:34px 34px;mask-image:linear-gradient(180deg,rgba(0,0,0,.42),transparent 70%)}

.screen.active{opacity:1;transform:none;pointer-events:auto}.topbar{position:absolute;top:28px;left:34px;right:34px;display:flex;align-items:center;justify-content:space-between;z-index:10}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;color:var(--brown)}.mark{width:42px;height:42px;border-radius:15px;background:var(--orange);color:white;display:grid;place-items:center;font-size:24px;box-shadow:0 12px 26px rgba(255,107,53,.28)}.pill{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.7);font-size:13px;color:var(--muted);backdrop-filter:blur(14px)}
/* welcome */
.hero{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:26px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:white;border:1px solid rgba(255,107,53,.18);color:var(--orange3);font-size:15px;font-weight:700;box-shadow:0 10px 34px rgba(255,107,53,.08);margin-bottom:20px}.title{font-size:72px;line-height:1.04;letter-spacing:-.05em;font-weight:950;color:var(--brown);margin-bottom:12px}.title span{color:var(--orange)}.subtitle{font-size:26px;color:var(--muted);font-weight:500;margin-bottom:34px}.blindbox-grid{width:min(620px,86vw);display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0 auto 34px;perspective:900px}.box-card{position:relative;height:184px;border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(255,246,235,.68));border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;animation:floaty 4.6s ease-in-out infinite}.box-card:nth-child(2){animation-delay:.35s}.box-card:nth-child(3){animation-delay:.7s}.box-card:nth-child(4){animation-delay:1.05s}.box-card:nth-child(5){animation-delay:1.4s}.box-card:nth-child(6){animation-delay:1.75s}.box-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 24%,rgba(255,107,53,.24),transparent 36%),linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,107,53,.10));}.box-card .q{position:relative;z-index:2;font-size:74px;font-weight:950;color:var(--orange);text-shadow:0 8px 24px rgba(255,107,53,.22)}.box-card .cup{position:absolute;bottom:-18px;font-size:78px;filter:blur(6px);opacity:.14}.box-card.peek{animation:peek 5.6s ease-in-out infinite}.box-card.peek .q{animation:qfade 5.6s ease-in-out infinite}.peek-name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:18px;font-weight:900;color:var(--orange3);opacity:0;z-index:3;transition:opacity .3s}.box-card.peek .peek-name{opacity:1}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes peek{0%,42%,100%{transform:translateY(0)}50%{transform:translateY(-6px) rotateY(12deg)}}

.cta{min-width:min(520px,86vw);height:96px;border-radius:999px;background:var(--text);color:white;font-size:30px;font-weight:900;letter-spacing:.04em;box-shadow:0 18px 48px rgba(30,24,20,.24);display:flex;align-items:center;justify-content:center;gap:12px;transition:.16s}.cta:active{transform:scale(.975)}.small-note{margin-top:16px;color:var(--muted);font-size:18px}.spark{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,.38),transparent 63%);filter:blur(2px);animation:pulse 3s ease-in-out infinite}.spark.s1{left:-40px;top:18%}.spark.s2{right:-60px;bottom:18%;animation-delay:1s}@keyframes pulse{50%{transform:scale(1.16);opacity:.65}}
/* intro/quiz */
.quiz-wrap{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}.progress{position:absolute;top:86px;left:42px;right:42px;height:12px;display:flex;gap:10px}.prog{flex:1;border-radius:99px;background:rgba(58,36,24,.10);overflow:hidden}.prog.on{background:var(--orange);box-shadow:0 8px 20px rgba(255,107,53,.22)}.question-card{width:100%;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.8);border-radius:42px;padding:34px 32px 30px;box-shadow:var(--shadow);backdrop-filter:blur(18px);text-align:center}.step{display:inline-flex;padding:9px 18px;border-radius:99px;background:rgba(255,107,53,.1);color:var(--orange);font-size:16px;font-weight:800;margin-bottom:18px}.question{font-size:42px;line-height:1.18;font-weight:950;letter-spacing:-.04em;color:var(--brown);margin-bottom:12px}.hint{font-size:18px;color:var(--muted);margin-bottom:26px}.options{display:grid;grid-template-columns:1fr 1fr;gap:18px}.option{height:150px;border-radius:30px;background:white;border:2px solid transparent;box-shadow:0 14px 38px rgba(78,42,18,.10);padding:22px;text-align:left;display:flex;align-items:center;gap:18px;transition:.16s}.option:active{transform:scale(.975);border-color:var(--orange);background:#FFF2E8}.emoji{width:76px;height:76px;border-radius:25px;background:linear-gradient(145deg,#FFF7EE,#FFE1C5);display:grid;place-items:center;font-size:40px;flex:none}.opt-text{font-size:24px;line-height:1.2;font-weight:850;color:var(--brown)}.opt-sub{font-size:15px;line-height:1.4;color:var(--muted);margin-top:6px;font-weight:500}.back{position:absolute;top:28px;left:34px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.8);color:var(--brown);font-size:28px;z-index:12;box-shadow:0 10px 26px rgba(78,42,18,.08)}
/* reveal */
.reveal-wrap{text-align:center;width:100%}.reveal-title{font-size:48px;font-weight:950;color:var(--brown);margin-bottom:12px}.reveal-sub{font-size:20px;color:var(--muted);margin-bottom:36px}.slot{width:min(620px,88vw);height:360px;margin:0 auto;border-radius:48px;background:rgba(255,255,255,.72);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.slot-track{display:flex;gap:18px;animation:slotspin 1.1s linear infinite}.slot-card{width:150px;height:220px;border-radius:32px;background:linear-gradient(135deg,var(--orange),var(--orange3));color:white;display:flex;align-items:center;justify-content:center;font-size:68px;font-weight:950;box-shadow:0 16px 38px rgba(255,107,53,.22)}@keyframes slotspin{to{transform:translateX(-168px)}}.opening .slot-track{animation-duration:.42s}.slow .slot-track{animation-duration:.85s}.stop .slot-track{animation:none}.open-dots{margin-top:24px;font-size:18px;color:var(--orange);font-weight:800;letter-spacing:.08em}
/* result — immersive poster, big & bold */
.result{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0}

.drink-visual{position:relative;width:min(440px,80vw);height:min(440px,80vw);border-radius:50%;margin-bottom:28px;display:flex;align-items:center;justify-content:center}
.drink-visual::before{content:"";position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,.22) 0%,transparent 70%);animation:resultGlow 3s ease-in-out infinite alternate}
.drink-visual::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.6),rgba(255,241,224,.3) 60%,transparent 80%)}

/* NFC zone — interactive animated */
.nfc-zone{position:relative;width:min(640px,92vw);padding:26px 30px;border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,246,235,.56));border:2px dashed rgba(255,107,53,.32);display:flex;align-items:center;gap:22px;overflow:hidden;cursor:pointer;transition:.25s}
.nfc-zone:active{transform:scale(.97)}

.nfc-icon-wrap{position:relative;width:68px;height:68px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:20px;background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(255,138,61,.06))}
.nfc-icon-wrap::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,107,53,.18);animation:nfcRingExpand 2.4s ease-out infinite}

.nfc-title{font-size:22px;font-weight:900;color:var(--brown);letter-spacing:.02em}

.nfc-dots span:nth-child(2){animation-delay:.3s}
.nfc-dots span:nth-child(3){animation-delay:.6s}
@keyframes nfcScan{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
@keyframes nfcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes nfcRingExpand{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes nfcDotPulse{0%,100%{opacity:.22;transform:scale(1)}50%{opacity:.6;transform:scale(1.4)}}
.result-actions{width:min(520px,86vw)}.btn{display:block;width:100%;height:72px;border-radius:99px;font-size:22px;font-weight:900;letter-spacing:.03em;transition:.16s}.btn:active{transform:scale(.97)}.btn.secondary{background:rgba(255,255,255,.72);color:var(--brown);border:1.5px solid rgba(58,36,24,.12);box-shadow:0 10px 28px rgba(78,42,18,.08)}.result-footnote{font-size:14px;color:var(--muted);margin-top:16px;letter-spacing:.03em}
.toast{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);padding:14px 24px;border-radius:99px;background:var(--text);color:white;font-size:16px;z-index:50;animation:toast 2.2s ease forwards}@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.topbar,.small-note{display:none}.hero{justify-content:space-between;padding-top:10px}.hero-main{width:100%;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center}.voice-note{margin-top:18px;color:var(--muted);font-size:20px;font-weight:600;letter-spacing:.03em}.cover-logo-wrap{width:min(220px,40vw);display:flex;align-items:center;justify-content:center;margin-top:18px;filter:drop-shadow(0 8px 18px rgba(78,42,18,.07));opacity:.96}.cover-logo-bottom{width:100%;height:auto;display:block}
.cover-card{cursor:pointer;display:block;padding:0;background:linear-gradient(150deg,rgba(255,255,255,.92),rgba(255,247,238,.76));border:1px solid rgba(255,255,255,.86);box-shadow:0 18px 48px rgba(78,42,18,.12),inset 0 1px 0 rgba(255,255,255,.86)}.cover-card:after{content:"";position:absolute;inset:12px;border-radius:22px;border:1px solid rgba(255,107,53,.12);pointer-events:none}.cover-card:active{transform:scale(.965);box-shadow:0 10px 28px rgba(78,42,18,.10),inset 0 1px 0 rgba(255,255,255,.9)}.card-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 14px;border-radius:inherit;backface-visibility:hidden;transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1)}.card-front{opacity:1;transform:rotateY(0)}.card-back{opacity:0;transform:rotateY(180deg);background:linear-gradient(135deg,var(--orange),var(--orange3));color:white}.cover-card.flipped .card-front{opacity:0;transform:rotateY(-180deg)}.cover-card.flipped .card-back{opacity:1;transform:rotateY(0)}.cover-card .q{font-size:56px;line-height:.9;text-shadow:0 8px 20px rgba(255,107,53,.18)}.cover-card .cup{bottom:6px;right:10px;font-size:54px;filter:blur(4px);opacity:.12}.card-no{position:absolute;top:14px;left:14px;z-index:3;padding:5px 9px;border-radius:999px;background:rgba(255,107,53,.10);color:var(--orange3);font-size:12px;font-weight:950;letter-spacing:.06em}.card-back .card-no{background:rgba(255,255,255,.18);color:white}.card-name{position:relative;z-index:3;font-size:22px;line-height:1.18;font-weight:950;letter-spacing:0;text-align:center;text-shadow:0 8px 18px rgba(78,42,18,.18)}.card-sparkle{position:absolute;right:16px;top:16px;z-index:3;color:rgba(255,107,53,.7);font-size:16px}.card-back .card-sparkle{color:rgba(255,255,255,.85)}
.cover-card{perspective:900px;transform-style:preserve-3d}.card-face{overflow:hidden;opacity:1;transform-style:preserve-3d;will-change:transform;transition:transform .78s cubic-bezier(.22,1,.36,1),box-shadow .78s cubic-bezier(.22,1,.36,1)}.card-face:before{content:"";position:absolute;inset:-30%;z-index:2;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.58) 48%,transparent 60%);transform:translateX(-135%) rotate(8deg);pointer-events:none}.card-front{transform:rotateY(0deg) translateZ(1px)}.card-back{opacity:1;transform:rotateY(180deg) translateZ(1px);background:radial-gradient(circle at 26% 16%,rgba(255,255,255,.22),transparent 32%),linear-gradient(135deg,var(--orange),var(--orange3));box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.cover-card.flipped .card-front{opacity:1;transform:rotateY(-180deg) translateZ(1px)}.cover-card.flipped .card-back{opacity:1;transform:rotateY(0deg) translateZ(1px)}.cover-card.is-flipping .card-face{box-shadow:0 18px 42px rgba(255,107,53,.16)}.cover-card.is-flipping .card-face:before{animation:cardSheen .78s cubic-bezier(.22,1,.36,1)}@keyframes cardSheen{0%{transform:translateX(-135%) rotate(8deg)}100%{transform:translateX(135%) rotate(8deg)}}
.question-card{max-width:760px;margin:0 auto;padding:30px 30px 28px}.quiz-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}.quiz-head .step{margin-bottom:0}.asr-btn{width:48px;height:48px;border-radius:50%;background:white;border:1px solid rgba(255,107,53,.18);box-shadow:0 8px 22px rgba(78,42,18,.08);display:grid;place-items:center;font-size:20px;color:var(--orange);transition:.2s;position:relative;z-index:3}.asr-btn.listening{background:var(--orange);color:white}.asr-btn.matched{background:#FFF2E8;color:var(--orange3);border-color:rgba(255,107,53,.36)}

.asr-wave-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px}.asr-wave-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,107,53,.35);pointer-events:none;opacity:0;transition:transform .15s ease-out,opacity .15s ease-out}.asr-wave-ring.r1{inset:-8px}.asr-wave-ring.r2{inset:-18px;border-width:1.5px;border-color:rgba(255,107,53,.22)}.asr-wave-ring.r3{inset:-30px;border-width:1px;border-color:rgba(255,107,53,.12)}.asr-wave-wrap.active .asr-wave-ring{opacity:1;animation:waveRingPulse 1.2s ease-out infinite}.asr-wave-wrap.active .asr-wave-ring.r2{animation-delay:.15s}.asr-wave-wrap.active .asr-wave-ring.r3{animation-delay:.3s}

.vol-bar{width:min(420px,70vw);height:6px;border-radius:99px;background:rgba(58,36,24,.08);margin:12px auto 0;overflow:hidden;opacity:0;transition:opacity .25s}.vol-bar.show{opacity:1}.vol-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange3),var(--orange));width:0%;transition:width .1s ease-out}

.result{padding-top:12px;justify-content:flex-start}.drink-visual{width:min(360px,68vw);height:min(360px,68vw);margin-bottom:22px}.drink-name{font-size:46px;margin-bottom:8px}.stars{font-size:24px;margin-bottom:12px}.keywords{gap:10px;margin-bottom:16px}.keyword{font-size:16px;padding:8px 18px}.quote{font-size:20px;margin-bottom:28px}.nfc-zone{width:min(580px,88vw);padding:22px 26px;margin-bottom:18px}.nfc-icon-wrap{width:60px;height:60px}.nfc-icon{font-size:28px}.nfc-title{font-size:20px}.nfc-sub{font-size:13px}.result-actions{width:min(480px,84vw)}.btn.secondary{height:66px;font-size:20px}.result-footnote{font-size:13px;margin-top:14px}

<body>
<div class="kiosk">
  <div class="spark s1"></div><div class="spark s2"></div>

  <section class="screen active" id="welcome">
    <div class="hero">
      <div class="hero-main">
      <div class="eyebrow">☕ 30秒解锁 · 今日专属咖啡</div>
      <h1 class="title">今日幸运<span>饮品</span></h1>
      <p class="subtitle">回答 5 个问题，打开属于你的那一杯</p>

const SFX = (() => {
  let ctx;
  function ac() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; }
  function tone(freq, dur, type='sine', vol=0.12, delay=0) {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + delay); o.stop(c.currentTime + delay + dur);
  }
  return {
    tap()     { tone(880, 0.08, 'sine', 0.10); },
    listen()  { tone(660, 0.12, 'sine', 0.08); tone(880, 0.15, 'sine', 0.10, 0.12); },
    select()  { tone(523, 0.06, 'triangle', 0.12); tone(784, 0.15, 'triangle', 0.12, 0.06); },
    retry()   { tone(330, 0.2, 'sawtooth', 0.06); },

    error()   { tone(220, 0.25, 'square', 0.08); tone(185, 0.3, 'square', 0.06, 0.25); }
  };
})();

return null}
window._asrOnEngineReady=function(){};
window._asrOnStart=function(){isListening=true;resetIdle();setASRStatus('listening');SFX.listen()};
window._asrOnStop=function(){isListening=false;if(!asrMatched&&asrAuto&&document.getElementById('quiz').classList.contains('active'))setTimeout(startASR,250)};
window._asrOnPartial=function(results){resetIdle();handleASRText((results||[]).join(''),true)};
window._asrOnResult=function(results){resetIdle();handleASRText((results||[]).join(''),false)};
window._asrOnError=function(){isListening=false;setASRStatus('error');SFX.error()};
let coverAutoTimer=null;
function setCoverCardFlip(card,flipped){card.classList.add('is-flipping');card.classList.toggle('flipped',flipped);setTimeout(()=>card.classList.remove('is-flipping'),820)}
function startCoverAutoFlip(){const card=document.querySelector('.cover-card.auto-peek');if(!card||card.dataset.autoFlipReady)return;card.dataset.autoFlipReady='1';setTimeout(()=>{if(card.classList.contains('auto-peek'))setCoverCardFlip(card,true)},850);coverAutoTimer=setInterval(()=>{if(!document.getElementById('welcome').classList.contains('active'))return;if(card.classList.contains('auto-peek'))setCoverCardFlip(card,!card.classList.contains('flipped'))},2800)}
function flipCoverCard(card){SFX.tap();resetIdle();setCoverCardFlip(card,!card.classList.contains('flipped'));card.classList.remove('auto-peek');if(coverAutoTimer){clearInterval(coverAutoTimer);coverAutoTimer=null}}
function showResult(forcedPick){SFX.result();let pick;if(Number.isInteger(forcedPick)){pick=forcedPick}else{let max=Math.max(...scores);pick=scores.findIndex(s=>s===max);if(pick<0)pick=0}const d=drinks[pick];document.getElementById('resultBox').innerHTML=`<div class="result-shell"><div class="result-badge">🎉 你的今日幸运饮品</div><div class="drink-visual"><img class="drink-img" src="${d.img}" onerror="this.outerHTML='<div class=\\'drink-fallback\\'>${d.emoji}</div>'"></div><h1 class="drink-name">${d.name}</h1><div class="stars">${d.stars}</div><div class="keywords">${d.keys.map(k=>`<span class="keyword">${k}</span>`).join('')}</div><p class="quote">${d.quote}</p><div class="nfc-zone"><div class="nfc-scanline"></div><div class="nfc-icon-wrap"><span class="nfc-icon">📱</span></div><span class="nfc-copy"><span class="nfc-title">碰一碰，带走结果</span><span class="nfc-sub">将手机靠近屏幕下方 NFC 感应区，保存你的幸运饮品</span></span><div class="nfc-dots"><span></span><span></span><span></span></div></div><div class="result-actions"><button class="btn secondary" onclick="startQuiz()">再测一次</button></div><div class="result-footnote">浪险橙 · 我们一起浪，一起险，一起成</div></div>`;go('result');if(window.AndroidNFC){try{window.AndroidNFC.prepareWrite(d.id);console.log('NFC URL set for drink:',d.id)}catch(e){console.warn('AndroidNFC.prepareWrite failed:',e)}}}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2300)}
let idleTimer;function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(!document.getElementById('welcome').classList.contains('active')){stopASR();asrAuto=false;go('welcome')}},90000)}
['touchstart','mousedown','keydown'].forEach(e=>document.addEventListener(e,resetIdle));resetIdle();
startCoverAutoFlip();
</script>
</body>
</html>
