/* ============================================
   浪险橙 Result Page — Mobile H5
   Warmth · Share · Social
   ============================================ */

:root {
  --orange:        #FF6B35;
  --orange-subtle: #FFF3EB;
  --orange-mid:    #E85D2C;
  --orange-glow:   rgba(255,107,53,0.15);

  --bg:            #FAFAF8;
  --surface:       #FFFFFF;
  --surface-muted: #F5F3F0;
  --border:        #D8D3CC;

  --text-primary:   #1A1A1A;
  --text-secondary: #757575;
  --text-tertiary:  #A5A09C;

  --warm-clay:     #D4A88C;
  --warm-sand:     #E8DDD4;

  --font: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --r-sm: 8px; --r-md: 16px; --r-lg: 24px; --r-full: 9999px;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:  cubic-bezier(0.7, 0, 0.84, 0);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text-primary);
  overflow-x: hidden;
}

/* --- Background Decorations --- */
.page-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.page-bg .glow-1 {
  position: absolute;
  width: 300px; height: 300px;
  top: -80px; right: -60px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,107,53,0.12) 0%, rgba(255,107,53,0.03) 50%, transparent 72%);
  animation: glowFloat 6s ease-in-out infinite;
}

.page-bg .glow-2 {
  position: absolute;
  width: 200px; height: 200px;
  bottom: 10%; left: -40px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,168,140,0.15) 0%, transparent 70%);
  animation: glowFloat 8s ease-in-out 1s infinite;
}

.page-bg .dot-1 {
  position: absolute;
  width: 8px; height: 8px;
  top: 18%; left: 12%;
  background: var(--orange);
  border-radius: 50%;
  opacity: 0.18;
  animation: dotDrift 5s ease-in-out infinite;
}

.page-bg .dot-2 {
  position: absolute;
  width: 6px; height: 6px;
  top: 35%; right: 8%;
  background: var(--warm-clay);
  border-radius: 50%;
  opacity: 0.22;
  animation: dotDrift 7s ease-in-out 0.5s infinite;
}

.page-bg .dot-3 {
  position: absolute;
  width: 10px; height: 10px;
  bottom: 22%; right: 15%;
  background: var(--orange);
  border-radius: 50%;
  opacity: 0.12;
  animation: dotDrift 6s ease-in-out 1.5s infinite;
}

.page-bg .dot-4 {
  position: absolute;
  width: 5px; height: 5px;
  bottom: 40%; left: 6%;
  background: var(--warm-sand);
  border-radius: 50%;
  opacity: 0.25;
  animation: dotDrift 9s ease-in-out 2s infinite;
}

@keyframes glowFloat {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
  50% { transform: translate(8px, -12px) scale(1.08); opacity: 1; }
}

@keyframes dotDrift {
  0%, 100% { transform: translateY(0); opacity: 0.15; }
  50% { transform: translateY(-8px); opacity: 0.3; }
}

/* --- Main Container --- */
.result-page {
  position: relative;
  z-index: 1;
  max-width: 430px;
  margin: 0 auto;
  padding: 0 24px;
  padding-top: env(safe-area-inset-top, 20px);
  padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 32px);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* --- Top Brand --- */
.brand-header {
  text-align: center;
  padding: 32px 0 20px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUpIn 0.6s var(--ease-out) 0.1s forwards;
}

.brand-logo {
  width: 52px; height: 52px;
  margin: 0 auto 8px;
}

.brand-logo svg {
  width: 100%; height: 100%;
}

.brand-name {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.15em;
  margin-bottom: 2px;
}

.brand-name span {
  color: var(--orange);
}

.brand-slogan {
  font-size: 0.78rem;
  font-weight: 300;
  color: var(--text-tertiary);
  letter-spacing: 0.08em;
}

/* --- Card --- */
.drink-card {
  width: 100%;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  overflow: hidden;
  margin-bottom: 24px;
  opacity: 0;
  transform: translateY(28px) scale(0.96);
  animation: cardIn 0.7s var(--ease-out) 0.3s forwards;
}

.drink-card-image {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: var(--surface-muted);
}

.drink-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.drink-card-image::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: linear-gradient(to top, rgba(255,255,255,0.9), transparent);
  pointer-events: none;
}

.drink-card-image .badge {
  position: absolute;
  top: 16px; left: 16px;
  padding: 4px 14px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: var(--r-full);
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--orange);
  letter-spacing: 0.06em;
  z-index: 2;
}

.drink-card-body {
  padding: 20px 24px 28px;
}

.drink-name {
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.04em;
  line-height: 1.3;
  margin-bottom: 8px;
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUpIn 0.5s var(--ease-out) 0.7s forwards;
}

.drink-tagline {
  font-size: 0.9rem;
  font-weight: 400;
  color: var(--orange);
  letter-spacing: 0.03em;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUpIn 0.5s var(--ease-out) 0.85s forwards;
}

.drink-divider {
  width: 32px;
  height: 2px;
  background: var(--orange);
  border-radius: 1px;
  margin-bottom: 16px;
  opacity: 0;
  transform: scaleX(0);
  animation: dividerIn 0.5s var(--ease-out) 1s forwards;
}

.drink-heartcopy {
  font-size: 0.88rem;
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.75;
  letter-spacing: 0.02em;
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUpIn 0.5s var(--ease-out) 1.1s forwards;
}

/* --- Share Section --- */
.share-section {
  width: 100%;
  margin-bottom: 24px;
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUpIn 0.5s var(--ease-out) 1.3s forwards;
}

.share-label {
  font-size: 0.78rem;
  font-weight: 400;
  color: var(--text-tertiary);
  text-align: center;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
}

.share-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.share-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all 0.2s;
  min-width: 90px;
  -webkit-tap-highlight-color: transparent;
}

.share-btn:active {
  transform: scale(0.95);
  background: var(--surface-muted);
}

.share-btn-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.share-btn-icon svg {
  width: 20px; height: 20px;
}

.share-btn.wechat .share-btn-icon {
  background: #07C160;
}

.share-btn.weibo .share-btn-icon {
  background: #E6162D;
}

.share-btn.save .share-btn-icon {
  background: var(--text-primary);
}

.share-btn-text {
  font-size: 0.72rem;
  font-weight: 400;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}

/* --- Bottom Brand --- */
.brand-footer {
  text-align: center;
  padding: 16px 0 8px;
  opacity: 0;
  animation: fadeUpIn 0.5s var(--ease-out) 1.5s forwards;
}

.brand-footer-text {
  font-size: 0.7rem;
  font-weight: 300;
  color: var(--text-tertiary);
  letter-spacing: 0.04em;
  line-height: 1.6;
}

.brand-footer-text a {
  color: var(--orange);
  text-decoration: none;
}

/* --- Fallback / Guide Page --- */
.guide-page {
  text-align: center;
  padding: 60px 24px 40px;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.guide-icon {
  width: 120px; height: 120px;
  margin: 0 auto 24px;
  position: relative;
}

.guide-icon .gi-circle {
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: var(--surface-muted);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

.guide-icon .gi-cup {
  position: absolute;
  width: 50px; height: 44px;
  border: 2.5px solid var(--warm-clay);
  border-radius: 6px 6px 20px 20px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0.7;
}

.guide-icon .gi-cup::after {
  content: '';
  position: absolute;
  top: 8px; right: -14px;
  width: 12px; height: 18px;
  border: 2px solid var(--warm-clay);
  border-left: none;
  border-radius: 0 8px 8px 0;
  opacity: 0.7;
}

.guide-icon .gi-steam {
  position: absolute;
  top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 40px; height: 24px;
}

.guide-icon .gi-steam-line {
  position: absolute;
  width: 2px; height: 12px;
  background: var(--warm-clay);
  border-radius: 1px;
  opacity: 0;
  animation: steamRise 2s ease-out infinite;
}

.guide-icon .gi-steam-line:nth-child(1) { left: 8px; animation-delay: 0s; }
.guide-icon .gi-steam-line:nth-child(2) { left: 18px; animation-delay: 0.4s; }
.guide-icon .gi-steam-line:nth-child(3) { left: 28px; animation-delay: 0.8s; }

@keyframes steamRise {
  0% { opacity: 0; transform: translateY(0) scaleY(0.5); }
  30% { opacity: 0.5; }
  100% { opacity: 0; transform: translateY(-16px) scaleY(1.2); }
}

.guide-title {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
  line-height: 1.4;
}

.guide-subtitle {
  font-size: 0.88rem;
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.6;
  max-width: 280px;
  margin: 0 auto 32px;
  letter-spacing: 0.02em;
}

.guide-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 40px;
  background: var(--orange);
  color: #FFF;
  font-size: 0.95rem;
  font-weight: 500;
  font-family: var(--font);
  letter-spacing: 0.04em;
  border: none;
  border-radius: var(--r-full);
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  box-shadow: 0 4px 16px rgba(255,107,53,0.25);
}

.guide-cta:active {
  transform: scale(0.97);
  background: var(--orange-mid);
}

.guide-cta .arrow {
  font-size: 0.85rem;
  transition: transform 0.2s;
}

.guide-cta:active .arrow {
  transform: translateX(3px);
}

/* --- Toast --- */
.result-toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 28px;
  background: var(--text-primary);
  color: #FFF;
  border-radius: var(--r-full);
  font-size: 0.82rem;
  font-weight: 400;
  letter-spacing: 0.03em;
  z-index: 999;
  white-space: nowrap;
  font-family: var(--font);
  animation: toastIn 0.3s var(--ease-out), toastOut 0.3s var(--ease-in) 2s forwards;
  pointer-events: none;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(-50%) translateY(0); }
  to { opacity: 0; transform: translateX(-50%) translateY(-8px); }
}

/* --- Animations --- */
@keyframes fadeUpIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes dividerIn {
  from { opacity: 0; transform: scaleX(0); }
  to { opacity: 1; transform: scaleX(1); }
}

/* --- Save canvas offscreen --- */
.save-canvas-wrap {
  position: fixed;
  left: -9999px;
  top: 0;
  z-index: -1;
}

/* --- Responsive --- */
@media (max-width: 375px) {
  .drink-name { font-size: 1.4rem; }
  .share-btn { min-width: 80px; padding: 12px 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

  <!-- Share Section -->
  <div class="share-section">

    <div class="share-buttons">

      <button class="share-btn wechat" onclick="shareWeChat()">

            <path d="M22 14C22 11.24 19.31 9 16 9C12.69 9 10 11.24 10 14C10 16.76 12.69 19 16 19C16.67 19 17.31 18.92 17.91 18.75L20 20L19.38 17.91C20.95 17.08 22 15.66 22 14ZM14 13C13.45 13 13 12.55 13 12C13 11.45 13.45 11 14 11C14.55 11 15 11.45 15 12C15 12.55 14.55 13 14 13ZM18 13C17.45 13 17 12.55 17 12C17 11.45 17.45 11 18 11C18.55 11 11 11.45 19 12C19 12.55 18.55 13 18 13Z" fill="white"/>

      <!-- Weibo -->
      <button class="share-btn weibo" onclick="shareWeibo()">

            <path d="M19.71 6.53C19.13 5.02 17.5 4.17 15.88 4.52C15.23 4.66 14.81 5.29 14.94 5.93C15.07 6.57 15.7 6.98 16.35 6.85C16.83 6.75 17.33 6.96 17.55 7.39C17.78 7.83 17.67 8.36 17.3 8.67C16.79 9.09 16.72 9.84 17.14 10.34C17.56 10.84 18.32 10.91 18.82 10.49C19.86 9.64 20.24 8.13 19.71 6.53Z" fill="white"/>
          </svg>

        <span class="share-btn-text">微博</span>

      <!-- Save Image -->
      <button class="share-btn save" onclick="saveImage()">
        <div class="share-btn-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3V15M12 15L8 11M12 15L16 11" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17V19C4 20.1 4.9 21 6 21H18C19.1 21 20 20.1 20 19V17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <span class="share-btn-text">保存图片</span>

  <!-- Footer -->
  <div class="brand-footer">

<!-- Guide Page (shown when no valid d param) -->
<div class="guide-page" id="guidePage" style="display:none;">
  <div class="page-bg">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="dot-1"></div>
    <div class="dot-2"></div>
  </div>
  <div class="guide-icon">
    <div class="gi-circle"></div>
    <div class="gi-cup"></div>
    <div class="gi-steam">
      <div class="gi-steam-line"></div>
      <div class="gi-steam-line"></div>
      <div class="gi-steam-line"></div>
    </div>
  </div>
  <h2 class="guide-title">来测测你的创业口味</h2>
  <p class="guide-subtitle">5 道情景题，找到与你最契合的前行饮品，碰一碰手机即刻保存</p>
  <button class="guide-cta" onclick="goToKiosk()">
    去测试 <span class="arrow">→</span>
  </button>
</div>

<!-- Hidden canvas for save image -->
<div class="save-canvas-wrap" id="saveCanvasWrap"></div>

<script>
// ==================== DATA ====================
const drinks = [
  { id: 'D1', name: '启程·梨想云', tagline: '每天都是新的起跑线', heartCopy: '每一个起点，都藏着你最好的可能。今天，就是你的新起跑线。', img: 'images/drink1.jpg' },
  { id: 'D2', name: '探路·莓抹思慕雪', tagline: '创业初期的复杂滋味，但值得', heartCopy: '路不是直的，味道也不是简单的。但复杂里，藏着最真实的你。', img: 'images/drink2.jpg' },
  { id: 'D3', name: '拼了·开心拿铁', tagline: '拼这一次，不问结果', heartCopy: '不是每次拼搏都有结果，但每次拼搏都有意义。这一杯，献给此刻的你。', img: 'images/drink3.jpg' },
  { id: 'D4', name: '商米橙·破晓', tagline: '从混沌到清晰，创业的第一缕光', heartCopy: '混乱之后，清晨终会来临。你已经走过最暗的那段路了。', img: 'images/drink4.jpg' },
  { id: 'D5', name: '桂在路上·冷萃', tagline: '路还长，但已经闻到桂花香', heartCopy: '不用急，慢慢来。走得稳的人，最终都能闻到桂花香。', img: 'images/drink5.jpg' },
  { id: 'D6', name: '上岸·奶砖拿铁', tagline: '熬过层层，开心上岸', heartCopy: '熬过来了。真的熬过来了。这一杯，是你给自己最好的礼物。', img: 'images/drink6.jpg' }
];

const BASE_URL = 'https://cafe.langxiancheng.com';

// ==================== INIT ====================
function init() {
  const params = new URLSearchParams(window.location.search);
  const drinkId = params.get('d');

  if (!drinkId) {
    showGuide();
    return;
  }

  const drink = drinks.find(function(d) { return d.id === drinkId; });

  if (!drink) {
    showGuide();
    return;
  }

  showResult(drink);
}

function showResult(drink) {
  // Update page title
  document.title = '我的创业口味是 ' + drink.name + ' — 浪险橙咖啡';

  // Update OG meta tags
  updateMeta('og:title', '我的创业口味是 ' + drink.name);
  updateMeta('og:description', drink.heartCopy);
  updateMeta('og:image', BASE_URL + '/' + drink.img);
  updateMeta('og:url', BASE_URL + '/result?d=' + drink.id);
  updateMeta('itemprop:name', '我的创业口味是 ' + drink.name);
  updateMeta('itemprop:description', drink.heartCopy);
  updateMeta('itemprop:image', BASE_URL + '/' + drink.img);

  // Fill in drink data
  document.getElementById('drinkImg').src = drink.img;
  document.getElementById('drinkImg').alt = drink.name;
  document.getElementById('drinkName').textContent = drink.name;
  document.getElementById('drinkTagline').textContent = drink.tagline;
  document.getElementById('drinkHeartCopy').textContent = drink.heartCopy;

  // Store current drink for sharing
  window._currentDrink = drink;

  // Show result page
  document.getElementById('resultPage').style.display = 'flex';
  document.getElementById('guidePage').style.display = 'none';
}

function showGuide() {
  document.getElementById('resultPage').style.display = 'none';
  document.getElementById('guidePage').style.display = 'flex';
}

function updateMeta(property, content) {
  var el = document.querySelector('meta[property="' + property + '"]') ||
           document.querySelector('meta[itemprop="' + property + '"]');
  if (el) {
    el.setAttribute('content', content);
  }
}

// ==================== SHARING ====================

/** WeChat share — copy link to clipboard, show toast */
function shareWeChat() {
  var drink = window._currentDrink;
  if (!drink) return;

  var url = BASE_URL + '/result?d=' + drink.id;
  var text = '我的创业口味是「' + drink.name + '」— ' + drink.heartCopy + ' ' + url;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('链接已复制，打开微信粘贴分享');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('链接已复制，打开微信粘贴分享');
  } catch(e) {
    showToast('复制失败，请手动复制链接');
  }
  document.body.removeChild(ta);
}

/** Weibo share — open Weibo share URL */
function shareWeibo() {
  var drink = window._currentDrink;
  if (!drink) return;

  var url = BASE_URL + '/result?d=' + drink.id;
  var title = '我的创业口味是「' + drink.name + '」';
  var pic = BASE_URL + '/' + drink.img;

  var weiboUrl = 'https://service.weibo.com/share/share.php?' +
    'title=' + encodeURIComponent(title + ' — ' + drink.heartCopy) +
    '&url=' + encodeURIComponent(url) +
    '&pic=' + encodeURIComponent(pic);

  window.open(weiboUrl, '_blank', 'width=600,height=500');
}

/** Save as image using html2canvas */
function saveImage() {
  var drink = window._currentDrink;
  if (!drink) return;

  showToast('正在生成图片…');

  var card = document.getElementById('drinkCard');

  html2canvas(card, {
    useCORS: true,
    allowTaint: false,
    backgroundColor: '#FFFFFF',
    scale: 2,
    logging: false,
    onclone: function(clonedDoc) {
      // Ensure the cloned card is visible
      var clonedCard = clonedDoc.getElementById('drinkCard');
      if (clonedCard) {
        clonedCard.style.opacity = '1';
        clonedCard.style.transform = 'none';
        clonedCard.style.animation = 'none';
        // Make all children visible too
        var children = clonedCard.querySelectorAll('.drink-name, .drink-tagline, .drink-heartcopy, .drink-divider');
        children.forEach(function(el) {
          el.style.opacity = '1';
          el.style.transform = 'none';
          el.style.animation = 'none';
        });
      }
    }
  }).then(function(canvas) {
    var link = document.createElement('a');
    link.download = '浪险橙_' + drink.name + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('图片已保存');
  }).catch(function(err) {
    console.error('html2canvas error:', err);
    showToast('图片生成失败，请截图保存');
  });
}

/** Navigate to kiosk */
function goToKiosk() {
  window.location.href = BASE_URL;
}

// ==================== TOAST ====================
function showToast(msg) {
  var existing = document.querySelector('.result-toast');
  if (existing) existing.remove();

  var t = document.createElement('div');
  t.className = 'result-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.remove(); }, 2500);
}

// ==================== START ====================
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
